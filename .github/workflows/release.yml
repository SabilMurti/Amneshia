name: Amneshia Multi-Channel Release

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v3.0.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-build:
    name: Test & Build Release Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          cd dashboard && npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Dashboard & Engine
        run: npm run build

      - name: Run Test Suite
        run: npm test

      - name: Package Release Tarball
        run: |
          # Package npm tarball
          TARBALL_NAME=$(npm pack)
          echo "PACKED_TARBALL=${TARBALL_NAME}" >> $GITHUB_ENV
          cp "${TARBALL_NAME}" amneshia-latest.tgz
          sha256sum "${TARBALL_NAME}" amneshia-latest.tgz > SHA256SUMS

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: |
            dist/
            dist-ui/
            *.tgz
            SHA256SUMS
          retention-days: 1

  publish-github-packages:
    name: Publish to GitHub Packages
    needs: validate-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://npm.pkg.github.com'
          scope: '@sabilmurti'

      - name: Publish to GitHub Packages
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if npm view "@sabilmurti/amneshia@$CURRENT_VERSION" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "Version $CURRENT_VERSION already published to GitHub Packages, skipping."
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-jsr:
    name: Publish to JSR (jsr.io)
    needs: validate-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Required for JSR OIDC authentication
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist

      - name: Publish to JSR
        run: npx -y jsr publish --allow-slow-types --allow-dirty

  publish-github-release:
    name: Publish GitHub Release & Assets
    needs: validate-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            *.tgz
            SHA256SUMS
            install.sh
          generate_release_notes: true
          draft: false
          prerelease: false
