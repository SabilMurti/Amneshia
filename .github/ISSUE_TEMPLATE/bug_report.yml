name: Bug report
description: Create a report to help us improve Amneshia
title: '[BUG] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen.
      placeholder: Tell us what happened...
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Clear steps explaining how to trigger or reproduce this issue.
      placeholder: |
        1. Run command 'amneshia ...'
        2. Execute tool '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: error-logs
    attributes:
      label: Error Logs & Terminal Output
      description: Paste any relevant error logs or terminal outputs.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: Node version, OS, Amneshia version, IDE (Cursor/Antigravity/Claude Code)
      placeholder: |
        - Node Version: v22.x
        - OS: Linux / macOS / Windows WSL2
        - Amneshia Version: v3.2.2
    validations:
      required: true
