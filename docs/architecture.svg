<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%" style="background: #09090b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#121217"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="emeraldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="amberGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="640" fill="url(#bgGrad)"/>
  <rect width="1000" height="640" fill="none" stroke="#27272a" stroke-width="1"/>

  <!-- Title Banner -->
  <g transform="translate(40, 40)">
    <text x="0" y="0" fill="#f4f4f5" font-size="22" font-weight="700" letter-spacing="-0.5px">🧠 Amneshia v3 Architecture</text>
    <text x="0" y="22" fill="#a1a1aa" font-size="13">Zero-External-Dependency Memory Engine • Truth Maintenance DAG • Dual-Write Markdown • Electric Violet UI</text>
  </g>

  <!-- SECTION 1: Clients & AI Agents -->
  <g transform="translate(40, 90)">
    <rect width="920" height="90" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
    <text x="20" y="28" fill="#71717a" font-size="11" font-weight="700" letter-spacing="1px">1. CLIENTS &amp; AGENT IDEs</text>
    
    <!-- Agent Cards -->
    <g transform="translate(20, 40)">
      <!-- Antigravity / Cursor -->
      <rect x="0" y="0" width="200" height="36" rx="8" fill="#27272a" stroke="#3f3f46"/>
      <circle cx="18" cy="18" r="6" fill="#8b5cf6"/>
      <text x="32" y="22" fill="#f4f4f5" font-size="13" font-weight="600">Antigravity IDE / Cursor</text>

      <!-- Claude Code / Windsurf -->
      <rect x="220" y="0" width="210" height="36" rx="8" fill="#27272a" stroke="#3f3f46"/>
      <circle cx="18" cy="18" r="6" fill="#06b6d4"/>
      <text x="32" y="22" fill="#f4f4f5" font-size="13" font-weight="600">Claude Code / Windsurf</text>

      <!-- Web Dashboard -->
      <rect x="450" y="0" width="220" height="36" rx="8" fill="#27272a" stroke="#3f3f46"/>
      <circle cx="18" cy="18" r="6" fill="#a855f7"/>
      <text x="32" y="22" fill="#f4f4f5" font-size="13" font-weight="600">3D Universe Dashboard</text>

      <!-- External MCP Clients -->
      <rect x="690" y="0" width="190" height="36" rx="8" fill="#27272a" stroke="#3f3f46"/>
      <circle cx="18" cy="18" r="6" fill="#10b981"/>
      <text x="32" y="22" fill="#f4f4f5" font-size="13" font-weight="600">Custom MCP Clients</text>
    </g>
  </g>

  <!-- Connection Arrows Downwards -->
  <path d="M 140 180 L 140 220" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 325 180 L 325 220" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 560 180 L 560 220" stroke="#a855f7" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 785 180 L 785 220" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- SECTION 2: Transport & API Server -->
  <g transform="translate(40, 220)">
    <rect width="920" height="80" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="20" y="26" fill="#71717a" font-size="11" font-weight="700" letter-spacing="1px">2. PROTOCOLS &amp; TRANSPORTS</text>

    <g transform="translate(20, 36)">
      <!-- Stdio Transport -->
      <rect x="0" y="0" width="270" height="32" rx="6" fill="#27272a" stroke="#8b5cf6" stroke-width="1"/>
      <text x="15" y="20" fill="#c084fc" font-size="12" font-weight="600">⚡ Stdio Transport (JSON-RPC 2.0)</text>

      <!-- HTTP / Dashboard Server -->
      <rect x="290" y="0" width="300" height="32" rx="6" fill="#27272a" stroke="#06b6d4" stroke-width="1"/>
      <text x="15" y="20" fill="#38bdf8" font-size="12" font-weight="600">🌐 HTTP &amp; UI Dashboard (Port 3457)</text>

      <!-- REST API Endpoints -->
      <rect x="610" y="0" width="270" height="32" rx="6" fill="#27272a" stroke="#10b981" stroke-width="1"/>
      <text x="15" y="20" fill="#34d399" font-size="12" font-weight="600">🔗 REST API (/api/stats, /api/graph)</text>
    </g>
  </g>

  <!-- SECTION 3: Amneshia v3 Core Engine -->
  <g transform="translate(40, 330)">
    <rect width="590" height="270" rx="14" fill="#121217" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="0" y="0" width="590" height="36" rx="14" fill="url(#purpleGradient)" opacity="0.25"/>
    <text x="20" y="24" fill="#c084fc" font-size="12" font-weight="700" letter-spacing="1px">3. AMNESHIA v3 CORE ENGINE</text>

    <!-- Sub-components inside Core -->
    <g transform="translate(20, 48)">
      <!-- 4 Core MCP Tools Host -->
      <rect x="0" y="0" width="265" height="90" rx="8" fill="#18181b" stroke="#27272a"/>
      <text x="14" y="22" fill="#f4f4f5" font-size="13" font-weight="700">🛠️ 4 Core Tools Surface</text>
      <text x="14" y="42" fill="#a1a1aa" font-size="11">• remember, recall, forget, context</text>
      <text x="14" y="58" fill="#a1a1aa" font-size="11">• 85% reduced token schema overhead</text>
      <text x="14" y="74" fill="#a1a1aa" font-size="11">• Zero arbitrary code execution</text>

      <!-- Truth Maintenance DAG -->
      <rect x="285" y="0" width="265" height="90" rx="8" fill="#18181b" stroke="#10b981" stroke-width="1"/>
      <text x="14" y="22" fill="#34d399" font-size="13" font-weight="700">⚡ Truth Maintenance DAG</text>
      <text x="14" y="42" fill="#a1a1aa" font-size="11">• Authority: system &gt; user &gt; agent</text>
      <text x="14" y="58" fill="#a1a1aa" font-size="11">• Pre-insertion contradiction alerts</text>
      <text x="14" y="74" fill="#a1a1aa" font-size="11">• Non-destructive soft invalidation</text>

      <!-- SQLite FTS5 Storage Engine -->
      <rect x="0" y="105" width="265" height="95" rx="8" fill="#18181b" stroke="#3b82f6" stroke-width="1"/>
      <text x="14" y="22" fill="#60a5fa" font-size="13" font-weight="700">💾 SQLite FTS5 Storage</text>
      <text x="14" y="42" fill="#a1a1aa" font-size="11">• ~/.amneshia/memory.db (WAL Mode)</text>
      <text x="14" y="58" fill="#a1a1aa" font-size="11">• BM25 sub-millisecond ranking</text>
      <text x="14" y="74" fill="#a1a1aa" font-size="11">• Automatic decay &amp; exponential half-life</text>

      <!-- Dual-Write Markdown Store -->
      <rect x="285" y="105" width="265" height="95" rx="8" fill="#18181b" stroke="#f59e0b" stroke-width="1"/>
      <text x="14" y="22" fill="#fbbf24" font-size="13" font-weight="700">📁 Dual-Write Markdown Store</text>
      <text x="14" y="42" fill="#a1a1aa" font-size="11">• .amneshia/knowledge/**/*.md</text>
      <text x="14" y="58" fill="#a1a1aa" font-size="11">• Human-in-the-loop auditability</text>
      <text x="14" y="74" fill="#a1a1aa" font-size="11">• Zero vendor lock-in git sync</text>
    </g>
  </g>

  <!-- SECTION 4: 3D Universe UI Dashboard -->
  <g transform="translate(650, 330)">
    <rect width="310" height="270" rx="14" fill="#121217" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="0" y="0" width="310" height="36" rx="14" fill="url(#purpleGradient)" opacity="0.25"/>
    <text x="20" y="24" fill="#c084fc" font-size="12" font-weight="700" letter-spacing="1px">4. 3D NEURAL DASHBOARD</text>

    <g transform="translate(15, 48)">
      <!-- Universe Visualizer -->
      <rect x="0" y="0" width="280" height="60" rx="8" fill="#18181b" stroke="#27272a"/>
      <text x="12" y="20" fill="#f4f4f5" font-size="12" font-weight="700">🌌 Three.js 3D Force Graph</text>
      <text x="12" y="38" fill="#a1a1aa" font-size="10">• Real-time orbit controls &amp; glow spheres</text>
      <text x="12" y="50" fill="#a1a1aa" font-size="10">• Color-coded authority &amp; node categories</text>

      <!-- Contradictions View -->
      <rect x="0" y="72" width="280" height="60" rx="8" fill="#18181b" stroke="#ef4444" stroke-width="1"/>
      <text x="12" y="20" fill="#f87171" font-size="12" font-weight="700">⚖️ Realtime Contradiction Inspector</text>
      <text x="12" y="38" fill="#a1a1aa" font-size="10">• Highlights factual conflicts in DAG</text>
      <text x="12" y="50" fill="#a1a1aa" font-size="10">• Immediate resolution &amp; supersession</text>

      <!-- Storage & Settings -->
      <rect x="0" y="144" width="280" height="56" rx="8" fill="#18181b" stroke="#27272a"/>
      <text x="12" y="20" fill="#f4f4f5" font-size="12" font-weight="700">📊 Storage &amp; Lineage Analytics</text>
      <text x="12" y="38" fill="#a1a1aa" font-size="10">• BM25 index metrics &amp; disk allocation</text>
      <text x="12" y="48" fill="#a1a1aa" font-size="10">• Export target sync &amp; prune controls</text>
    </g>
  </g>

  <!-- Connecting Lines Between Components -->
  <path d="M 630 450 L 650 450" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Footer Version Note -->
  <text x="40" y="625" fill="#52525b" font-size="11">Amneshia v3.0.0 Architecture • Built with TypeScript, SQLite FTS5, Express 5, React 18 &amp; Three.js</text>
</svg>