<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgAmbient" cx="25%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#3b0764" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#1e1035" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#09090b" stop-opacity="1"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
    </radialGradient>

    <radialGradient id="cardStarBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.5"/>
      <stop offset="35%" stop-color="#9333ea" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#6b21a8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="cardHatGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="40%" stop-color="#9333ea"/>
      <stop offset="75%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>

    <linearGradient id="cardStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b1"/>
      <feGaussianBlur stdDeviation="14" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowWide" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="sb1"/>
      <feGaussianBlur stdDeviation="28" result="sb2"/>
      <feMerge>
        <feMergeNode in="sb2"/>
        <feMergeNode in="sb1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="640" fill="#09090b"/>
  <rect width="1280" height="640" fill="url(#bgAmbient)"/>

  <!-- Subtle Blueprint Tech Grid Lines -->
  <g stroke="#27272a" stroke-width="0.75" opacity="0.25">
    <line x1="0" y1="80" x2="1280" y2="80" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="400" x2="1280" y2="400" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="0" y1="560" x2="1280" y2="560" />
    
    <line x1="160" y1="0" x2="160" y2="640" />
    <line x1="320" y1="0" x2="320" y2="640" />
    <line x1="480" y1="0" x2="480" y2="640" />
    <line x1="640" y1="0" x2="640" y2="640" />
    <line x1="800" y1="0" x2="800" y2="640" />
    <line x1="960" y1="0" x2="960" y2="640" />
    <line x1="1120" y1="0" x2="1120" y2="640" />
  </g>

  <!-- Card Border Accent -->
  <rect x="1" y="1" width="1278" height="638" rx="0" fill="none" stroke="#27272a" stroke-width="1.5"/>

  <!-- ================= LEFT: ICON / GLYPH ================= -->
  <g transform="translate(40, 50) scale(1.15)">
    <!-- Ambient Halo -->
    <circle cx="270" cy="115" r="100" fill="url(#cardStarBloom)" />

    <!-- Brim Orbit -->
    <path d="M 90 320 C 50 335, 70 375, 150 370 C 210 365, 260 330, 310 335 C 360 340, 370 380, 310 385 C 230 390, 170 340, 90 320 Z" 
          fill="none" 
          stroke="url(#cardHatGrad)" 
          stroke-width="7.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#neon)" />

    <!-- Hat Silhouette -->
    <path d="M 125 340 C 155 290, 180 220, 225 150 C 245 120, 268 100, 288 95 C 278 125, 265 165, 265 210 C 265 260, 285 300, 300 340" 
          fill="none" 
          stroke="url(#cardHatGrad)" 
          stroke-width="7" 
          stroke-linecap="round"
          filter="url(#neon)" />

    <!-- Lattice Lines -->
    <g stroke="url(#cardHatGrad)" stroke-width="2.5" opacity="0.85">
      <line x1="125" y1="340" x2="175" y2="315" />
      <line x1="175" y1="315" x2="150" y2="260" />
      <line x1="125" y1="340" x2="150" y2="260" />
      <line x1="150" y1="260" x2="200" y2="240" />
      <line x1="175" y1="315" x2="220" y2="295" />
      <line x1="200" y1="240" x2="220" y2="295" />
      <line x1="220" y1="295" x2="280" y2="305" />
      <line x1="220" y1="295" x2="260" y2="255" />
      <line x1="200" y1="240" x2="260" y2="255" />
      <line x1="280" y1="305" x2="300" y2="340" />
      <line x1="150" y1="260" x2="185" y2="195" />
      <line x1="200" y1="240" x2="185" y2="195" />
      <line x1="185" y1="195" x2="225" y2="185" />
      <line x1="200" y1="240" x2="225" y2="185" />
      <line x1="260" y1="255" x2="225" y2="185" />
      <line x1="260" y1="255" x2="265" y2="210" />
      <line x1="225" y1="185" x2="225" y2="150" />
      <line x1="225" y1="150" x2="260" y2="145" />
      <line x1="265" y1="210" x2="260" y2="145" />
      <line x1="225" y1="150" x2="288" y2="95" />
      <line x1="260" y1="145" x2="288" y2="95" />
    </g>

    <!-- Synaptic Spheres -->
    <g fill="#ffffff" filter="url(#neon)">
      <circle cx="90" cy="320" r="5.5" fill="#c084fc"/>
      <circle cx="150" cy="370" r="6.5" fill="#a855f7"/>
      <circle cx="125" cy="340" r="6.5" fill="#e9d5ff"/>
      <circle cx="175" cy="315" r="8" fill="#ffffff"/>
      <circle cx="150" cy="260" r="7" fill="#e9d5ff"/>
      <circle cx="220" cy="295" r="8.5" fill="#ffffff"/>
      <circle cx="200" cy="240" r="8" fill="#f5f3ff"/>
      <circle cx="185" cy="195" r="6.5" fill="#e9d5ff"/>
      <circle cx="225" cy="185" r="7.5" fill="#ffffff"/>
      <circle cx="260" cy="255" r="7.5" fill="#e9d5ff"/>
      <circle cx="280" cy="305" r="6.5" fill="#c084fc"/>
      <circle cx="300" cy="340" r="6" fill="#a855f7"/>
      <circle cx="225" cy="150" r="6.5" fill="#f5f3ff"/>
      <circle cx="260" cy="145" r="6.5" fill="#e9d5ff"/>
      <circle cx="265" cy="210" r="7" fill="#c084fc"/>
    </g>

    <!-- Star Flare with Dual Blur (Zero Clipping) -->
    <g transform="translate(288, 95)" filter="url(#glowWide)">
      <path d="M 0 -40 Q 3 -7, 28 0 Q 3 7, 0 40 Q -3 7, -28 0 Q -3 -7, 0 -40 Z" 
            fill="url(#cardStarGrad)"/>
      <path d="M 0 -24 Q 2 -3, 17 0 Q 2 3, 0 24 Q -2 3, -17 0 Q -2 -3, 0 -24 Z" 
            fill="#ffffff"/>
      <circle cx="0" cy="0" r="5" fill="#ffffff"/>
    </g>
  </g>

  <!-- ================= RIGHT: BRANDING & TYPOGRAPHY ================= -->
  <g transform="translate(540, 115)">
    <!-- Protocol Badge Pill -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="310" height="34" rx="17" fill="#1e1b4b" stroke="url(#badgeBorder)" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="5" fill="#10b981"/>
      <text x="32" y="22" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5px">MODEL CONTEXT PROTOCOL</text>
      <text x="245" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">v3.0.3</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="105" 
          fill="url(#textGrad)" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="68" 
          font-weight="900" 
          letter-spacing="-1px">Amneshia</text>

    <!-- Primary Headline -->
    <text x="0" y="155" 
          fill="#f1f5f9" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="22" 
          font-weight="700" 
          letter-spacing="-0.3px">Deterministic Knowledge Graph &amp; Truth Maintenance</text>
    
    <text x="0" y="185" 
          fill="#c084fc" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="20" 
          font-weight="600" 
          letter-spacing="-0.2px">for Claude Code, Cursor, Windsurf &amp; Antigravity</text>

    <!-- Feature Pillars (Pill Badges) -->
    <g transform="translate(0, 230)">
      <!-- Pill 1: SQLite FTS5 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="160" height="34" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
        <g transform="translate(12, 9.5)">
          <path d="M 8 1 L 2 8 L 7 8 L 6 14 L 13 6 L 8 6 Z" fill="#38bdf8"/>
        </g>
        <text x="32" y="21.5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">&lt;1ms BM25 Search</text>
      </g>

      <!-- Pill 2: Markdown as Truth -->
      <g transform="translate(172, 0)">
        <rect x="0" y="0" width="170" height="34" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
        <g transform="translate(12, 9.5)">
          <path d="M 2 3 C 2 2.45 2.45 2 3 2 L 6 2 C 6.55 2 7 2.45 7.4 3 L 8.6 4.5 C 8.9 4.8 9.3 5 9.7 5 L 13 5 C 13.55 5 14 5.45 14 6 L 14 11 C 14 11.55 13.55 12 13 12 L 3 12 C 2.45 12 2 11.55 2 11 Z" fill="#34d399"/>
        </g>
        <text x="32" y="21.5" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Markdown-as-Truth</text>
      </g>

      <!-- Pill 3: Cascading Invalidation -->
      <g transform="translate(354, 0)">
        <rect x="0" y="0" width="200" height="34" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
        <g transform="translate(12, 9.5)">
          <path d="M 7.5 1.5 L 2.5 3.5 L 2.5 7.5 C 2.5 10.5 4.5 12.8 7.5 13.8 C 10.5 12.8 12.5 10.5 12.5 7.5 L 12.5 3.5 Z" fill="#f43f5e"/>
        </g>
        <text x="32" y="21.5" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Cascading Invalidation</text>
      </g>

      <!-- Pill 4: 85% Token Reduction -->
      <g transform="translate(0, 46)">
        <rect x="0" y="0" width="175" height="34" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
        <g transform="translate(12, 9.5)">
          <rect x="3.5" y="3.5" width="8" height="8" rx="1.5" fill="none" stroke="#fbbf24" stroke-width="1.3"/>
          <circle cx="7.5" cy="7.5" r="1.5" fill="#fbbf24"/>
          <line x1="5.5" y1="1" x2="5.5" y2="3.5" stroke="#fbbf24" stroke-width="1.2"/>
          <line x1="9.5" y1="1" x2="9.5" y2="3.5" stroke="#fbbf24" stroke-width="1.2"/>
          <line x1="5.5" y1="11.5" x2="5.5" y2="14" stroke="#fbbf24" stroke-width="1.2"/>
          <line x1="9.5" y1="11.5" x2="9.5" y2="14" stroke="#fbbf24" stroke-width="1.2"/>
          <line x1="1" y1="5.5" x2="3.5" y2="5.5" stroke="#fbbf24" stroke-width="1.2"/>
          <line x1="1" y1="9.5" x2="3.5" y2="9.5" stroke="#fbbf24" stroke-width="1.2"/>
          <line x1="11.5" y1="5.5" x2="14" y2="5.5" stroke="#fbbf24" stroke-width="1.2"/>
          <line x1="11.5" y1="9.5" x2="14" y2="9.5" stroke="#fbbf24" stroke-width="1.2"/>
        </g>
        <text x="32" y="21.5" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">-85% Schema Tokens</text>
      </g>

      <!-- Pill 5: 3D Universe -->
      <g transform="translate(187, 46)">
        <rect x="0" y="0" width="175" height="34" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
        <g transform="translate(12, 9.5)">
          <path d="M 7.5 1 Q 8 5.5 12.5 7.5 Q 8 9.5 7.5 14 Q 7 9.5 2.5 7.5 Q 7 5.5 7.5 1 Z" fill="#c084fc"/>
        </g>
        <text x="32" y="21.5" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">3D Neural Universe</text>
      </g>

      <!-- Pill 6: Zero Cloud -->
      <g transform="translate(374, 46)">
        <rect x="0" y="0" width="165" height="34" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
        <g transform="translate(12, 9.5)">
          <rect x="3" y="6" width="9" height="7" rx="1.5" fill="#a1a1aa"/>
          <path d="M 5 6 L 5 4.5 C 5 3.1 6.1 2 7.5 2 C 8.9 2 10 3.1 10 4.5 L 10 6" fill="none" stroke="#a1a1aa" stroke-width="1.3" stroke-linecap="round"/>
        </g>
        <text x="32" y="21.5" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">100% Local / MIT</text>
      </g>
    </g>

    <!-- Bottom Footer Meta -->
    <g transform="translate(0, 360)">
      <text x="0" y="0" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="600">
        curl -fsSL https://raw.githubusercontent.com/SabilMurti/Amneshia/main/install.sh | bash
      </text>
    </g>
  </g>
</svg>
